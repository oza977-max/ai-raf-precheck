name: Deploy to GitHub Pages

# INSTALLED as .github/workflows/deploy-pages.yml as of 2026-08-31
# (site-survey-003 finding 6.1). This copy is kept as the documented
# source/reference; edit .github/workflows/deploy-pages.yml directly and
# copy changes back here, since GitHub only runs the .github/workflows/
# copy.
#
# Publishes the static build so testers get a URL instead of a git clone.
# Counterpoise has no backend (NF-3) — the whole app is the contents of dist/ —
# so static hosting is a complete deployment, not a demo shim.
#
# Repository Pages settings must be Source: "GitHub Actions" (not "Deploy
# from a branch") for this to run — see the repo's Settings → Pages, or
# `gh api -X PUT repos/OWNER/REPO/pages -f build_type=workflow`. Note that
# on a private repo, GitHub Pages requires a paid plan, and enabling it
# publishes the site to the open internet. See docs/tester-guide.md for the
# alternatives if neither is acceptable.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The gates that guard the product's claims. A build that fails these
      # must not become the thing a tester is looking at.
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
