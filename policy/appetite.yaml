# ==============================================================================
# AIGate — Starter Policy File
# AI Risk Appetite Framework Configuration
# ==============================================================================
#
# READ THIS BEFORE USING
# ----------------------
# This file is a template. It is grounded in SR 26-2 (US), SS1/23 (UK PRA),
# EU AI Act, OSFI E-23 (Canada), MAS (Singapore), DORA, and FSA Japan.
#
# REGULATORY CURRENCY — last reviewed 2026-07-26. What changed at that review:
#   * SR 26-2 issued 2026-04-17 (replaces SR 11-7). Generative and agentic AI
#     are carved OUT of the model definition (footnote 3) but remain subject to
#     general risk management. TRACK-III exists to catch exactly that gap.
#   * EU AI Act Digital Omnibus postponed Annex III high-risk obligations to
#     2 December 2027. Article 50 transparency was NOT postponed and applies
#     from 2 August 2026 — this drove INV-DISCLOSE-01 below.
#   * OSFI E-23 final published 2025-09-11, in force 1 May 2027.
#   * MAS: FEAT is non-binding; formal AI Risk Management Guidelines were
#     consulted on (closed 31 Jan 2026) with a 12-month transition. Not yet
#     a stable rule source.
# A verdict is only as current as this date. Re-check on each regulator alert;
# see docs/approach.md for the maintenance loop.
# It is a credible, defensible starting point — but it is not your framework
# until your CRO or equivalent has reviewed and formally adopted it.
#
# YOU OWN WHAT YOU ADOPT.
#
# Using this file verbatim without review is an implicit governance decision.
# Document that decision. Search for [FIRM] markers below — each one requires
# your organisation's specific input before verdicts are considered final.
#
# The three situations:
#   1. You have a formal AI RAF → translate it into this schema, replacing
#      the starter rules with your own.
#   2. You have scattered AI governance → use this as your unifying starting
#      point and customise it to match your actual committees and thresholds.
#   3. You have nothing AI-specific yet → this becomes your framework.
#      Review it with your CRO. The [FIRM] markers show you where to start.
#
# Versioning: increment `version` each time you change this file.
# The version is recorded in every verdict's audit trail.
# ==============================================================================

version: "1.0"
policy_id: "RAF-001"
firm_name: "[FIRM]"

translation_attestation:
  attested_by: "[FIRM] — 2LoD Lead"
  role: "Head of AI Governance"
  date: "[DATE]"
  raf_version_checked: "[Board-approved AI RAF version and date]"

hard_lines:
  - id: "HL-001"
    description: "Level 4 autonomy on irreversible client-facing actions"
    condition:
      autonomy_level: { gte: 4 }
      output_reversibility: "irreversible"
      exposure: { in: ["client-facing", "market-facing"] }
    reason: "No control set can bring fully autonomous, irreversible, client-facing AI within appetite."
    regulatory_basis: "SS1/23 §3.8; SR 26-2 §IV"

  - id: "HL-002"
    description: "MNPI flowing to any external Zone A system"
    condition:
      data_class: { in: ["MNPI"] }
      data_zone: { in: ["Zone A"] }
    reason: "MNPI outside Zone C violates market abuse prevention requirements."
    regulatory_basis: "MAR Article 8; MiFID II"

  - id: "HL-003"
    description: "Fully autonomous lending or credit decisions (no HITL)"
    condition:
      autonomy_level: { gte: 4 }
      decision_type: { in: ["lending-decision", "credit-decision"] }
      hitl: false
    reason: "EU AI Act Annex III §5(b) + Consumer Credit Directive require human oversight on credit decisions."
    regulatory_basis: "EU AI Act Annex III §5(b); Consumer Credit Directive 2023/2225"

  - id: "HL-004"
    description: "Fully autonomous trading decisions"
    condition:
      autonomy_level: { gte: 4 }
      decision_type: { in: ["trading"] }
    reason: "Fully autonomous trading decisions with no human oversight are outside appetite at any tier."
    regulatory_basis: "RAF §5 rule; MiFID II Article 17"

  - id: "HL-005"
    description: "Irreversible action above autonomy L1"
    condition:
      output_reversibility: "irreversible"
      autonomy_level: { gte: 2 }
    reason: "Irreversible actions require Level 1 or below regardless of tier."
    regulatory_basis: "HTML §7 — Irreversible actions require Level 1 or below regardless of tier"

tracks:
  - id: "TRACK-I"
    name: "Track I — Traditional MRM"
    description: "Traditional statistical/mathematical models producing quantitative outputs for material decisions"
    conditions:
      - field: "model_type"
        value: { in: ["statistical", "traditional-ml"] }
      - field: "decision_bindingness"
        value: { in: ["material", "binding"] }
    short_circuit: true
    regulatory_basis: "SS1/23 §3.4; SR 26-2 §II.A"

  - id: "TRACK-II"
    name: "Track II — AI on MRM"
    description: "ML/AI models within MRM scope under the applicable jurisdiction ceiling"
    conditions:
      - field: "model_type"
        value: { in: ["ml", "deep-learning", "llm", "generative-ai"] }
      - field: "decision_bindingness"
        value: { in: ["material", "binding", "advisory"] }
    short_circuit: true
    regulatory_basis: "SS1/23 §3.4 (technology-agnostic); OSFI E-23 §2.1"

  - id: "TRACK-II-REPLACE"
    name: "Track II — Replaces prior model"
    description: "Any use case that replaces a prior model is subject to Track II regardless of model type"
    conditions:
      - field: "replaces_prior_model"
        value: true
    short_circuit: true
    regulatory_basis: "RAF §5 rule 3"

  - id: "TRACK-II-AUTONOMY"
    name: "Track II — High autonomy"
    description: "Use cases with autonomy level >= 3 are subject to Track II"
    conditions:
      - field: "autonomy_level"
        value: { gte: 3 }
    short_circuit: true
    regulatory_basis: "RAF §5 rule 4"

  - id: "TRACK-III"
    name: "Track III — AI Governance"
    description: "Generative and agentic AI carved out of MRM by SR 26-2 footnote 3 — outside model risk, NOT outside governance; routed here"
    conditions:
      - field: "model_type"
        value: { in: ["llm", "generative-ai", "agentic"] }
      - field: "decision_bindingness"
        value: { in: ["non-binding"] }
    short_circuit: true
    regulatory_basis: "SR 26-2 footnote 3 (generative and agentic AI outside MRM scope; issued 2026-04-17, exclusion stated as temporary)"

tiers:
  - id: "TIER-CRITICAL"
    name: "Critical"
    description: "Highest materiality — requires 2LoD approval + full model validation pipeline"
    triggers:
      - field: "decision_type"
        value: { in: ["credit-decision", "lending-decision", "fraud-detection"] }
        regulatory_basis: "EU AI Act Annex III §5(b); OSFI E-23 §4.2"
      - field: "exposure"
        value: { in: ["market-facing"] }
      - field: "decision_type"
        value: { in: ["pricing"] }
        regulatory_basis: "grounding/raf-extraction.md §D"

  - id: "TIER-HIGH"
    name: "High"
    triggers:
      - field: "exposure"
        value: { in: ["client-facing"] }
      - field: "decision_type"
        value: { in: ["regulatory-reporting"] }
      - field: "autonomy_level"
        value: { gte: 3 }
      - field: "data_class"
        value: { in: ["Client PII", "MNPI"] }

  - id: "TIER-MEDIUM"
    name: "Medium"
    triggers:
      - field: "exposure"
        value: { in: ["internal-shared"] }
      - field: "autonomy_level"
        value: { in: [2] }

  - id: "TIER-LOW"
    name: "Low"
    triggers:
      - field: "exposure"
        value: "internal-only"

# Invariants — the rules evaluated against the graph. Each MUST have at
# least one control whose `resolves` names it, or a use case tripping it
# is rejected as unsatisfiable (that is deliberate for INV-ZONE-01).
# Derived from grounding/raf-extraction.md §E (worked examples) and §F
# (control library). Thresholds and scope are STARTER content: review and
# adjust to your firm's actual appetite before adoption.
invariants:
  - id: "INV-DATA-01"
    description: "Client PII must not flow to an external model endpoint without encryption in transit"
    condition:
      data_class: { in: ["Client PII"] }
      data_zone: { in: ["Zone A", "Zone B"] }
    required_controls: ["CTRL-ENC-01"]
    severity: "High"
    regulatory_basis: "GDPR Art. 32(1)(a)"

  - id: "INV-ZONE-01"
    description: "MNPI must remain within Zone C"
    condition:
      data_class: "MNPI"
      data_zone: { not_in: ["Zone C"] }
    required_controls: []
    severity: "Critical"
    regulatory_basis: "MAR Article 8; MiFID II"

  - id: "INV-DISCLOSE-01"
    description: "A person dealing with an AI must be told they are dealing with an AI"
    condition:
      exposure: { in: ["client-facing"] }
      model_type: { in: ["llm", "generative-ai", "agentic"] }
    required_controls: ["CTRL-DISCLOSE-01"]
    severity: "High"
    regulatory_basis: "EU AI Act Art. 50(1) — applies from 2026-08-02, NOT postponed by the Digital Omnibus"

  - id: "INV-TRACK2-01"
    description: "Track II baseline — hosted models can be substituted without notice; output fingerprinting and version pinning are mandatory"
    condition:
      model_type: { in: ["ml", "deep-learning", "llm", "generative-ai"] }
      decision_bindingness: { in: ["advisory", "material", "binding"] }
    required_controls: ["CTRL-FINGERPRINT-01"]
    severity: "High"
    regulatory_basis: "RAF §5 — Track II baseline; zero tolerance for unmonitored vendor model change"

  - id: "INV-HALLUC-01"
    description: "Generative output feeding a material decision must be grounded — every claim resolves to a retrievable source"
    condition:
      model_type: { in: ["llm", "generative-ai"] }
      decision_bindingness: { in: ["material", "binding"] }
    required_controls: ["CTRL-GROUND-01"]
    severity: "High"
    regulatory_basis: "RAF §9 — grounding verification mode"

  - id: "INV-CITE-01"
    description: "Generative drafting must attach resolvable citations; unverified output is marked as such"
    condition:
      model_type: { in: ["llm", "generative-ai"] }
      action_type: { in: ["draft"] }
    required_controls: ["CTRL-CITE-01"]
    severity: "Medium"
    regulatory_basis: "RAF §9 — grounding minimum requirements"

  - id: "INV-AGENT-01"
    description: "Tool-using systems require minimal permissions, full tool-call logging and a kill switch"
    condition:
      model_type: { in: ["agentic"] }
    required_controls: ["CTRL-LOG-01"]
    severity: "High"
    regulatory_basis: "RAF §6 — agentic / tool-use controls"

  - id: "INV-AUTONOMY-01"
    description: "Autonomy at L2 or above on a material or binding decision requires a human decision gate"
    condition:
      autonomy_level: { gte: 2 }
      decision_bindingness: { in: ["material", "binding"] }
    required_controls: ["CTRL-HITL-02"]
    severity: "Critical"
    regulatory_basis: "RAF §7 — autonomy ceiling"

  - id: "INV-CONDUCT-01"
    description: "Client- or market-facing AI output requires conduct testing and transcript audit"
    condition:
      exposure: { in: ["client-facing", "market-facing"] }
    required_controls: ["CTRL-CONDUCT-01"]
    severity: "High"
    regulatory_basis: "RAF §4 — conduct & fairness"

  - id: "INV-ESCALATE-01"
    description: "Conversational client-facing systems require a documented human escalation path"
    condition:
      model_type: { in: ["llm", "generative-ai"] }
      exposure: { in: ["client-facing"] }
    required_controls: ["CTRL-ESCALATE-01"]
    severity: "High"
    regulatory_basis: "RAF §4 — client harm / escalation"

  - id: "INV-DRIFT-01"
    description: "Quantitative models informing material decisions require drift monitoring against validation baseline"
    condition:
      model_type: { in: ["statistical", "traditional-ml", "ml", "deep-learning"] }
      decision_bindingness: { in: ["material", "binding"] }
    required_controls: ["CTRL-DRIFT-01"]
    severity: "High"
    regulatory_basis: "RAF §8 — drift signals; SS1/23 §3.4"

  - id: "INV-EXPLAIN-01"
    description: "Machine-learned models informing material decisions require explainability documentation"
    condition:
      model_type: { in: ["ml", "deep-learning"] }
      decision_bindingness: { in: ["material", "binding"] }
    required_controls: ["CTRL-EXPLAIN-01"]
    severity: "Medium"
    regulatory_basis: "RAF §5 — Track II transparency"

  - id: "INV-SEC-01"
    description: "Prompt-injectable systems shared beyond a single team require periodic adversarial red-teaming"
    condition:
      model_type: { in: ["llm", "generative-ai", "agentic"] }
      exposure: { in: ["internal-shared", "client-facing", "market-facing"] }
    required_controls: ["CTRL-REDTEAM-01"]
    severity: "Medium"
    regulatory_basis: "RAF §9 — adversarial verification mode"

  - id: "INV-SAMPLE-01"
    description: "Recommendation or classification at scale requires continuous behavioural sampling against human ground truth"
    condition:
      action_type: { in: ["recommend"] }
      scale: "at_scale"
    required_controls: ["CTRL-SAMPLE-01"]
    severity: "Medium"
    regulatory_basis: "RAF §9 — behavioural verification mode"

# Control library (grounding/raf-extraction.md §F). The solver picks the
# minimal burden-weighted set covering every tripped invariant, using the
# `resolves` list below — an invariant no control resolves makes the use
# case unsatisfiable. `burden` is 1 (cheapest) to 5 (heaviest).
#
# Proof-carrying controls (V1.3): a control with no verification_evidence
# block is treated as UNVERIFIED. Statuses are hand-attested in this file
# in V1; machine-checked evidence binding arrives in V1.5.
controls:
  - id: "CTRL-ENC-01"
    name: "Encryption in transit (TLS 1.3+)"
    description: "All data in transit to external endpoints must use TLS 1.3 or higher"
    resolves: ["INV-DATA-01"]
    burden: 1
    verification: "Deployment manifest shows TLS 1.3 endpoint; no HTTP fallback"
    verification_evidence:
      status: "verified"
      detail: "Platform allow-list pins TLS 1.3; platform attestation on file"
      attested_by: "[FIRM] — Platform Engineering"
      attested_at: "[DATE]"

  - id: "CTRL-DISCLOSE-01"
    name: "AI interaction disclosure"
    description: "The interface states plainly that the user is interacting with an AI system, before or at the point of interaction"
    resolves: ["INV-DISCLOSE-01"]
    burden: 1
    verification: "Screenshot or UX spec showing the disclosure at first contact"

  - id: "CTRL-SYNTHMARK-01"
    name: "Synthetic content marking"
    description: "AI-generated content leaving the firm is marked in a machine-readable format as artificially generated"
    resolves: []
    burden: 3
    verification: "Output carries provenance metadata (e.g. C2PA) detectable by a third party"

  - id: "CTRL-FINGERPRINT-01"
    name: "Output fingerprinting + version pinning"
    description: "Model version pinned; outputs fingerprinted against a fixed probe set to detect silent substitution"
    resolves: ["INV-TRACK2-01"]
    burden: 2
    verification: "Probe set and baseline fingerprints on file; alert on step-change in aggregate grounding confidence"

  - id: "CTRL-CITE-01"
    name: "Citation resolution"
    description: "Every generated claim carries a resolvable citation; unverified claims are visibly marked"
    resolves: ["INV-CITE-01"]
    burden: 2
    verification: "Sampled outputs show citations resolving to retrievable sources"

  - id: "CTRL-ESCALATE-01"
    name: "Human escalation path"
    description: "Documented route from the AI interaction to a human owner, surfaced to the client"
    resolves: ["INV-ESCALATE-01"]
    burden: 2
    verification: "Escalation route documented, staffed, and exercised in testing"

  - id: "CTRL-LOG-01"
    name: "Tool-call logging, kill switch and minimal permissions"
    description: "All tool invocations logged to an append-only store; kill switch disables execution within 1 hour; permissions scoped to the minimum required"
    resolves: ["INV-AGENT-01"]
    burden: 2
    verification: "Log store is append-only; kill-switch procedure documented and tested"

  - id: "CTRL-HITL-02"
    name: "Human decision gate (HITL L2)"
    description: "Every action proposed by the AI is reviewed and approved by a human before execution"
    resolves: ["INV-AUTONOMY-01"]
    burden: 3
    verification: "UI shows human approval step; audit trail records approval identity and timestamp"

  - id: "CTRL-DRIFT-01"
    name: "Drift monitoring"
    description: "Continuous monitoring of model drift against the validation baseline, with defined amber/red thresholds"
    resolves: ["INV-DRIFT-01"]
    burden: 3
    verification: "Drift dashboard live; thresholds match the KRI table; breach routes to 2LoD"

  - id: "CTRL-EXPLAIN-01"
    name: "Explainability documentation"
    description: "Documented account of how the model reaches its outputs, sufficient for independent validation"
    resolves: ["INV-EXPLAIN-01"]
    burden: 3
    verification: "Explainability pack reviewed by independent validation"

  - id: "CTRL-REDTEAM-01"
    name: "Adversarial red-teaming"
    description: "Structured red-teaming for injection, jailbreak, exfiltration and role confusion; quarterly minimum, pre-launch for Track II"
    resolves: ["INV-SEC-01"]
    burden: 3
    verification: "Red-team report on file within the last quarter; findings tracked to closure"

  - id: "CTRL-SAMPLE-01"
    name: "Behavioural sampling"
    description: "Continuous sampling of outputs against human ground truth, with disagreement triage"
    resolves: ["INV-SAMPLE-01"]
    burden: 3
    verification: "Sampling rate and triage process documented; disagreement rate tracked"

  - id: "CTRL-GROUND-01"
    name: "Grounding verification"
    description: "Claim-level source resolution, per-claim confidence scoring, citation attachment, and an immutable audit log available to 2LoD"
    resolves: ["INV-HALLUC-01"]
    burden: 4
    verification: "Audit log records claim, source, confidence, timestamp and model version; failed grounding routes to human review"

  - id: "CTRL-CONDUCT-01"
    name: "Conduct testing + transcript audit"
    description: "Pre-launch and periodic conduct testing, with sampled transcript audit for client harm and fairness"
    resolves: ["INV-CONDUCT-01"]
    burden: 4
    verification: "Conduct test results and transcript audit sampling on file"

kri_thresholds:
  performance:
    drift_pct: { green: { lte: 3.0 }, amber: { lte: 7.0 }, red: { gt: 7.0 } }
    override_rate_pct:
      low_risk: { green: { gte: 5.0, lte: 40.0 }, amber: { lte: 80.0 }, red: { gt: 80.0 } }
      high_risk: { green: { gte: 5.0, lte: 20.0 }, amber: { lte: 50.0 }, red: { gt: 50.0 } }
  data_privacy:
    pii_incident_count: { green: 0, amber: { lte: 2 }, red: { gt: 2 } }
  technology:
    model_version_staleness_days: { green: { lte: 60 }, amber: { lte: 120 }, red: { gt: 120 } }
  conduct:
    bias_disparity_pct: { green: { lte: 1.5 }, amber: { lte: 3.0 }, red: { gt: 3.0 } }
  third_party_concentration:
    single_vendor_share_pct: { green: { lte: 40.0 }, amber: { lte: 60.0 }, red: { gt: 60.0 } }
  autonomy:
    level_4_approval_required: true

jurisdictions:
  - code: "UK"
    name: "United Kingdom"
    pack_files: ["policy/packs/ss1-23.yaml"]
  - code: "US"
    name: "United States"
    pack_files: ["policy/packs/sr-26-2.yaml"]
  - code: "EU"
    name: "European Union"
    pack_files: ["policy/packs/eu-ai-act.yaml", "policy/packs/dora.yaml"]
  - code: "CA"
    name: "Canada"
    pack_files: ["policy/packs/osfi-e23.yaml"]
  - code: "SG"
    name: "Singapore"
    pack_files: ["policy/packs/mas-feat.yaml"]
  - code: "JP"
    name: "Japan"
    pack_files: ["policy/packs/fsa-japan.yaml"]

roles:
  "1LoD": { access: "own" }
  "2LoD": { access: "all" }

tier_workflow:
  Critical: "2LoD-approve"
  High: "2LoD-approve"
  Medium: "2LoD-notify"
  Low: "self-service"

safety_margin: 0.10

# ==============================================================================
# APPROVED PLATFORM REGISTRY (PV-1) — [FIRM] MUST REPLACE
# ==============================================================================
# Illustrative entries so the inheritance mechanics are visible before a firm
# builds its own registry (PV-8). These are NOT your firm's approvals.
#
# How it works: a use case declaring one of these platforms inherits the
# controls its approval already satisfies — but ONLY where the use case sits
# inside the approved envelope. Exceed any dimension and the inheritance is
# withdrawn (PV-3), because a platform approval is granted as a package and
# partially exceeding its basis does not leave the remainder justified.
#
# Every inheritance is shown on the verdict with the envelope that justified
# it, so "was residency assessed?" has an answer (PV-6).
platforms:
  - id: "PLAT-INTERNAL-ML"
    name: "[FIRM] internal ML platform"
    approved_envelope:
      max_data_class: "Confidential"
      max_exposure: "internal-shared"
      max_autonomy_level: 2
      data_zones: ["Zone B", "Zone C"]
      jurisdictions: ["UK", "EU"]
    satisfies_controls:
      - "CTRL-ENC-01"
      - "CTRL-FINGERPRINT-01"
      - "CTRL-DRIFT-01"

  - id: "PLAT-CLOUD-LLM"
    name: "[FIRM] approved cloud LLM service"
    # Deliberately narrower: cleared for drafting work, not for client-facing
    # output or personal data. A client-facing chatbot on this platform
    # exceeds it and inherits nothing — the visible over-envelope case PV-8
    # asks for.
    approved_envelope:
      max_data_class: "Internal"
      max_exposure: "internal-shared"
      max_autonomy_level: 1
      data_zones: ["Zone B"]
      jurisdictions: ["UK", "EU"]
    satisfies_controls:
      - "CTRL-ENC-01"
      - "CTRL-FINGERPRINT-01"

# APPROVED VENDOR / MODEL REGISTRY (PV-2) — [FIRM] MUST REPLACE
# A model not on this registry is treated as a new vendor and inherits
# nothing (PV-5). Ids must match the `vendor` recorded on the use case.
vendors:
  - id: "VENDOR-APPROVED-LLM"
    name: "[FIRM]-approved third-party LLM"
    approved_envelope:
      max_data_class: "Internal"
      max_exposure: "internal-shared"
      data_zones: ["Zone B"]
    satisfies_controls:
      - "CTRL-ENC-01"
