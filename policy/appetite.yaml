# ==============================================================================
# AIGate — Starter Policy File
# AI Risk Appetite Framework Configuration
# ==============================================================================
#
# READ THIS BEFORE USING
# ----------------------
# This file is a template. It is grounded in SR 26-2 (US), SS1/23 (UK PRA),
# EU AI Act, OSFI E-23 (Canada), MAS FEAT (Singapore), DORA, and FSA Japan.
# It is a credible, defensible starting point — but it is not your framework
# until your CRO or equivalent has reviewed and formally adopted it.
#
# YOU OWN WHAT YOU ADOPT.
#
# Using this file verbatim without review is an implicit governance decision.
# Document that decision. Search for [FIRM] markers below — each one requires
# your organisation's specific input before verdicts are considered final.
#
# The three situations:
#   1. You have a formal AI RAF → translate it into this schema, replacing
#      the starter rules with your own.
#   2. You have scattered AI governance → use this as your unifying starting
#      point and customise it to match your actual committees and thresholds.
#   3. You have nothing AI-specific yet → this becomes your framework.
#      Review it with your CRO. The [FIRM] markers show you where to start.
#
# Versioning: increment `version` each time you change this file.
# The version is recorded in every verdict's audit trail.
# ==============================================================================

meta:
  firm: "[FIRM]"                        # Replace with your organisation name
  version: "0.1-starter"
  effective_date: "[DATE]"              # Replace with adoption date
  owner: "[AI RISK FUNCTION NAME]"      # e.g. "AI Risk (2LoD)"
  approved_by: "[CRO NAME / TITLE]"     # Replace before going live
  classification: "Restricted"
  note: >
    Starter configuration — template values in use. Replace all [FIRM]
    markers before this file is considered the firm's adopted appetite.

# ------------------------------------------------------------------------------
# Full policy content will be generated by /gvm-tech-spec and /gvm-build.
# This file establishes the structure and preamble.
# Rule schema — every rule follows this pattern:
#
#   - id: "PE-JUR-UK-1"
#     description: "Track II if quantitative output into a regulated decision (UK)"
#     source:
#       document: "SS1/23"
#       section: "§3.4"
#       text: >
#         "Models that produce quantitative outputs used in material
#          decisions require independent validation."
#     confidence: high          # high | medium | low
#     reviewed_by: "[NAME]"     # Replace with reviewer name and role
#     reviewed_date: "[DATE]"   # Replace with sign-off date
#     condition: ...            # the rule logic
#     effect: ...               # what it changes (track, tier, controls)
#
# Rules without a source block, confidence score, reviewed_by, and
# reviewed_date are treated as DRAFT and produce provisional verdicts.
#
# Sections to be populated by /gvm-tech-spec and /gvm-build:
#   - hard_lines
#   - track_classification_rules
#   - tiering_rules
#   - jurisdiction_overrides      (with primary source citations per rule)
#   - control_library
#   - kri_thresholds
#   - platform_registry           (PV domain — approved platforms with envelopes)
#   - vendor_model_registry       (PV domain — approved vendors/models with envelopes)
#   - roles                       (who can submit, who sees the register)
#   - tier_workflow_mapping       (what process each tier triggers)
# ------------------------------------------------------------------------------
