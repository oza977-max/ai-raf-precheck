# ==============================================================================
# AIGate — Starter Policy File
# AI Risk Appetite Framework Configuration
# ==============================================================================
#
# READ THIS BEFORE USING
# ----------------------
# This file is a template. It is grounded in SR 26-2 (US), SS1/23 (UK PRA),
# EU AI Act, OSFI E-23 (Canada), MAS (Singapore), DORA, and FSA Japan.
#
# CHANGE LOG
#   1.3 (2026-07-27) — removed the three unauthored jurisdiction packs
#       (CA/SG/JP). They emitted real controls from invented regulatory text.
#       CA, SG and JP remain declared jurisdictions with no pack, which is the
#       honest state: the firm operates there and it has not been assessed.
#   1.2 (2026-07-27) — oracle round 002. Two blind adjudicators re-scored the
#       corpus against v1.1 and were asked to hunt REGRESSIONS, not just gaps.
#       They found that several v1.1 fixes had displaced the defect rather than
#       removed it: TRACK-III-AGENTIC was promoted above the special tracks so
#       high-autonomy agents stop being routed to MRM; INV-ZONE-01 retired (its
#       condition had become byte-identical to the widened HL-002, making it
#       unreachable); INV-DISCLOSE-01 narrowed back to client-facing (Art. 50(1)
#       needs a person interacting, not a channel); INV-ESCALATE-01's model-type
#       gate removed so escalation follows the affected person like conduct and
#       fairness already do; INV-AUTONOMY-01/02 now require an ACTING
#       action_type, so they stop demanding authority envelopes of
#       recommend-only supervised systems; and the binding-constraint tie-break
#       is declared here rather than living only in engine code.
#   1.1 (2026-07-27) — oracle round 001. Two independent adjudicators scored
#       31 corpus cases from this file alone, blind to the engine. Fixes:
#       track list made TOTAL (9 of 28 model_type x bindingness pairs matched
#       no track, incl. agentic on binding decisions); TRACK-II-REPLACE and
#       TRACK-II-AUTONOMY moved first so they are reachable at all;
#       CTRL-AUTONOMY-BOUND-01 added so autonomy is mitigable rather than only
#       abolishable; INV-FAIRNESS-01 added (conduct keyed on the affected
#       person, not the delivery channel); INV-SYNTHMARK-01 added, giving the
#       orphaned CTRL-SYNTHMARK-01 a consumer; INV-IRREV-01 added and HL-005
#       retired into it; HL-002 widened to match its own stated reason; HL-006
#       added for agentic binding authority; INV-VENDOR-01 added; agentic and
#       LLM scope widened across CITE/HALLUC/DRIFT/EXPLAIN/SEC; materiality and
#       hiring now tier. See backtest/oracle-round-001.md.
#   1.0 — starter content.
#
# REGULATORY CURRENCY — last reviewed 2026-07-26. What changed at that review:
#   * SR 26-2 issued 2026-04-17 (replaces SR 11-7). Generative and agentic AI
#     are carved OUT of the model definition (footnote 3) but remain subject to
#     general risk management. TRACK-III exists to catch exactly that gap.
#   * EU AI Act Digital Omnibus postponed Annex III high-risk obligations to
#     2 December 2027. Article 50 transparency was NOT postponed and applies
#     from 2 August 2026 — this drove INV-DISCLOSE-01 below.
#   * OSFI E-23 final published 2025-09-11, in force 1 May 2027.
#   * MAS: FEAT is non-binding; formal AI Risk Management Guidelines were
#     consulted on (closed 31 Jan 2026) with a 12-month transition. Not yet
#     a stable rule source.
# A verdict is only as current as this date. Re-check on each regulator alert;
# see docs/approach.md for the maintenance loop.
# It is a credible, defensible starting point — but it is not your framework
# until your CRO or equivalent has reviewed and formally adopted it.
#
# YOU OWN WHAT YOU ADOPT.
#
# Using this file verbatim without review is an implicit governance decision.
# Document that decision. Search for [FIRM] markers below — each one requires
# your organisation's specific input before verdicts are considered final.
#
# The three situations:
#   1. You have a formal AI RAF → translate it into this schema, replacing
#      the starter rules with your own.
#   2. You have scattered AI governance → use this as your unifying starting
#      point and customise it to match your actual committees and thresholds.
#   3. You have nothing AI-specific yet → this becomes your framework.
#      Review it with your CRO. The [FIRM] markers show you where to start.
#
# Versioning: increment `version` each time you change this file.
# The version is recorded in every verdict's audit trail.
# ==============================================================================

version: "1.3"
policy_id: "RAF-001"
firm_name: "[FIRM]"

translation_attestation:
  attested_by: "[FIRM] — 2LoD Lead"
  role: "Head of AI Governance"
  date: "[DATE]"
  raf_version_checked: "[Board-approved AI RAF version and date]"

hard_lines:
  # Bright lines. No control set cures these — they short-circuit evaluation.
  # Kept deliberately few: a hard line that a control could reasonably mitigate
  # belongs in `invariants`, not here. Oracle round 001 demoted the former
  # HL-005 (irreversible + autonomy >= 2) for exactly that reason — it rejected
  # routine retention-driven deletion, which GDPR storage-limitation requires.
  # It now lives as INV-IRREV-01 with a reversal-window control.
  - id: "HL-001"
    description: "Level 4 autonomy on irreversible client-facing or market-facing actions"
    condition:
      autonomy_level: { gte: 4 }
      output_reversibility: "irreversible"
      exposure: { in: ["client-facing", "market-facing"] }
    reason: "Fully autonomous irreversible action reaching a client or the market leaves no point of human control before harm is done."
    regulatory_basis: "SS1/23 §3.8; SR 26-2 §IV"

  - id: "HL-002"
    description: "Price-sensitive information processed outside the controlled zone"
    # Oracle round 001: the condition previously read `data_zone: Zone A`
    # while the reason said "outside Zone C" — a vendor-hosted Zone B service
    # holding MNPI escaped the bright line and rejected only via the
    # unsatisfiable INV-ZONE-01. Condition now matches the stated reason.
    condition:
      data_class: { in: ["MNPI"] }
      data_zone: { not_in: ["Zone C"] }
    reason: "MNPI outside Zone C violates market abuse prevention requirements."
    regulatory_basis: "MAR Article 8; MiFID II"

  - id: "HL-003"
    description: "Autonomous credit or lending decision with no human in the loop"
    condition:
      autonomy_level: { gte: 4 }
      decision_type: { in: ["credit-decision", "lending-decision"] }
      hitl: false
    reason: "A lending decision taken with no human review removes the accountable decision-maker the regulation assumes exists."
    regulatory_basis: "EU AI Act Annex III §5(b); Consumer Credit Directive 2023/2225"

  - id: "HL-004"
    description: "Autonomous trading execution"
    condition:
      autonomy_level: { gte: 4 }
      decision_type: { in: ["trading"] }
    reason: "Autonomous market execution can move positions faster than any human control can intervene."
    regulatory_basis: "RAF §5 rule; MiFID II Article 17"

  # NOTE: the id HL-005 is RETIRED, not reused. It named "irreversible action
  # above autonomy L1", which oracle round 001 demoted to INV-IRREV-01 because a
  # reversal window genuinely mitigates it. Reusing the id for a different rule
  # would make every archived verdict citing HL-005 ambiguous.
  - id: "HL-006"
    description: "Agentic system holding binding decision authority at full autonomy"
    # NEW (oracle round 001). The prior HL-005 was wholly subsumed by HL-001 —
    # verified exhaustively: 2 matching combinations, 0 escaped. This one is
    # independent: it fires on agentic tool-use with binding authority even
    # where the action is reversible and internal, which HL-001 never reaches.
    condition:
      model_type: { in: ["agentic"] }
      autonomy_level: { gte: 4 }
      decision_bindingness: { in: ["binding"] }
    reason: "An agent that both chooses its own actions and binds the firm to them has no point at which a human ratifies the decision."
    regulatory_basis: "SR 26-2 §III.C (agentic AI); OSFI E-23 §4.3"

# ------------------------------------------------------------------------------
# TRACKS — governance route. MUST BE TOTAL over model_type x bindingness.
# ------------------------------------------------------------------------------
# Oracle round 001 found 9 of 28 model_type x decision_bindingness combinations
# matched NO track, so the engine returned no verdict at all. Two causes, both
# fixed here:
#
#   1. TRACK-I and TRACK-II were scoped to material/binding (and advisory),
#      leaving every non-binding quantitative model and every advisory
#      statistical model unrouted. They are now scoped by model_type alone.
#   2. Tracks are first-match / short_circuit, and the SPECIAL tracks
#      (REPLACE, AUTONOMY) were declared AFTER the general ones — so they could
#      never fire for the cases they exist to catch. They are now declared
#      FIRST. Order in this list is load-bearing; do not sort it.
#
# Totality check lives in src/engine/track.test.ts — it enumerates the full
# cross-product and fails if any combination is unrouted.
tracks:
  - id: "TRACK-III-AGENTIC"
    name: "Track III — Agentic AI governance"
    description: "Tool-using agentic systems at any bindingness are routed to AI governance"
    # Agentic is routed on model_type alone, and FIRST.
    #
    # v1.1 put this after TRACK-II-REPLACE/AUTONOMY, which meant any agentic
    # system at autonomy >= 3 or replacing a prior model matched those instead
    # and was routed to MRM — i.e. the highest-risk agents were the ones
    # excluded from the agentic governance track that exists to catch them.
    # Oracle round 002 found this independently on both models: v1.1 fixed one
    # ordering bug by creating another, one rule further down.
    conditions:
      - field: "model_type"
        value: { in: ["agentic"] }
    short_circuit: true
    regulatory_basis: "SR 26-2 footnote 3 (agentic AI outside MRM scope; issued 2026-04-17, exclusion stated as temporary)"

  - id: "TRACK-II-REPLACE"
    name: "Track II — Replaces a prior model"
    description: "Any use case replacing a prior model is subject to Track II regardless of model type"
    conditions:
      - field: "replaces_prior_model"
        value: true
    short_circuit: true
    regulatory_basis: "RAF §5 rule 3"

  - id: "TRACK-II-AUTONOMY"
    name: "Track II — High autonomy"
    description: "Autonomy level 3 or above is subject to Track II regardless of model type"
    conditions:
      - field: "autonomy_level"
        value: { gte: 3 }
    short_circuit: true
    regulatory_basis: "RAF §5 rule 4"

  - id: "TRACK-III"
    name: "Track III — AI Governance"
    description: "Generative AI carved out of MRM by SR 26-2 footnote 3 — outside model risk, NOT outside governance"
    conditions:
      - field: "model_type"
        value: { in: ["llm", "generative-ai"] }
      - field: "decision_bindingness"
        value: { in: ["non-binding"] }
    short_circuit: true
    regulatory_basis: "SR 26-2 footnote 3 (generative and agentic AI outside MRM scope; issued 2026-04-17, exclusion stated as temporary)"

  - id: "TRACK-I"
    name: "Track I — Traditional MRM"
    description: "Traditional statistical and mathematical models under the established model risk framework"
    conditions:
      - field: "model_type"
        value: { in: ["statistical", "traditional-ml"] }
    short_circuit: true
    regulatory_basis: "SS1/23 §3.4; SR 26-2 §II.A"

  - id: "TRACK-II"
    name: "Track II — AI on MRM"
    description: "ML and generative models within MRM scope under the applicable jurisdiction ceiling"
    conditions:
      - field: "model_type"
        value: { in: ["ml", "deep-learning", "llm", "generative-ai"] }
    short_circuit: true
    regulatory_basis: "SS1/23 §3.4 (technology-agnostic); OSFI E-23 §2.1"

tiers:
  - id: "TIER-CRITICAL"
    name: "Critical"
    description: "Highest materiality — requires 2LoD sign-off + full model validation pipeline"
    triggers:
      - field: "decision_type"
        value: { in: ["credit-decision", "lending-decision", "fraud-detection"] }
        regulatory_basis: "EU AI Act Annex III §5(b); OSFI E-23 §4.2"
      - field: "exposure"
        value: { in: ["market-facing"] }
      - field: "decision_type"
        value: { in: ["pricing"] }
        regulatory_basis: "grounding/raf-extraction.md §D"

  - id: "TIER-HIGH"
    name: "High"
    triggers:
      - field: "exposure"
        value: { in: ["client-facing"] }
      - field: "decision_type"
        value: { in: ["regulatory-reporting"] }
      - field: "autonomy_level"
        value: { gte: 3 }
      - field: "data_class"
        value: { in: ["Client PII", "MNPI"] }
      # Oracle round 001: `hiring` triggered no base tier at all, so a CV
      # screener was Critical only when the EU pack happened to be loaded.
      # Employment materiality is a firm-level appetite question. It sits at
      # High here and the EU pack floors it to Critical under Annex III §4(a) —
      # so the firm has a position of its own AND the jurisdiction can raise it.
      - field: "decision_type"
        value: { in: ["hiring"] }
      # Oracle round 001: tiering keyed on exposure, decision_type, autonomy and
      # data_class but NEVER on how much weight the output carries — so a model
      # binding a material decision tiered identically to an advisory one.
      - field: "decision_bindingness"
        value: { in: ["binding"] }

  - id: "TIER-MEDIUM"
    name: "Medium"
    triggers:
      - field: "exposure"
        value: { in: ["internal-shared"] }
      - field: "autonomy_level"
        value: { in: [2] }
      - field: "decision_bindingness"
        value: { in: ["material"] }

  - id: "TIER-LOW"
    name: "Low"
    triggers:
      - field: "exposure"
        value: "internal-only"

# ------------------------------------------------------------------------------
# INVARIANTS — the rules evaluated against the graph.
# ------------------------------------------------------------------------------
# Each MUST have at least one control whose `resolves` names it, or a use case
# tripping it is rejected as unsatisfiable. That is deliberate for INV-ZONE-01
# and for nothing else.
#
# Where two controls resolve the same invariant, the solver picks by burden and
# the second gives coverage DEPTH — which is what makes the CS-1 safety margin
# achievable at all. A library with exactly one control per invariant can never
# exceed a margin of zero.
invariants:
  - id: "INV-DATA-01"
    description: "Client PII must not flow to an external model endpoint without encryption in transit"
    condition:
      data_class: { in: ["Client PII"] }
      data_zone: { in: ["Zone A", "Zone B"] }
    severity: "High"
    required_controls: ["CTRL-ENC-01"]
    regulatory_basis: "GDPR Art. 32(1)(a)"

  # INV-ZONE-01 is RETIRED (oracle round 002), not merely unused.
  #
  # v1.1 widened HL-002 to `data_zone: not_in [Zone C]` so it matched its own
  # stated reason. That made its condition byte-identical to INV-ZONE-01's —
  # and because hard lines short-circuit, the invariant became unreachable by
  # any input while still carrying a comment describing it as load-bearing.
  # Both adjudicators found it. A rulebook that contains a rule the engine can
  # never evaluate is worse than one that is missing it: a reader budgets for
  # a control path that does not exist.
  #
  # MNPI outside the controlled zone is now solely HL-002's business. The id is
  # not reused.

  - id: "INV-DISCLOSE-01"
    description: "A person interacting with an AI system must be told they are interacting with an AI"
    # NARROWED BACK to client-facing (oracle round 002). v1.1 widened this to
    # market-facing on the reasoning that Art. 50(1) follows the person rather
    # than the channel — but the Article attaches to systems "intended to
    # interact directly with natural persons", and a market-facing artefact
    # like a Pillar 3 filing has no interaction and no interface to disclose
    # on. Both adjudicators flagged CTRL-DISCLOSE-01 ("the interface states
    # plainly... before the interaction begins") being demanded of a document.
    # Art. 50(2) marking is the right rule for published artefacts, and
    # INV-SYNTHMARK-01 already carries it.
    condition:
      model_type: { in: ["llm", "generative-ai", "agentic"] }
      exposure: { in: ["client-facing"] }
    severity: "High"
    required_controls: ["CTRL-DISCLOSE-01"]
    regulatory_basis: "EU AI Act Art. 50(1) — applies from 2026-08-02, NOT postponed by the Digital Omnibus"

  - id: "INV-SYNTHMARK-01"
    description: "AI-generated content leaving the firm must be machine-readably marked as artificially generated"
    # NEW (oracle round 001). CTRL-SYNTHMARK-01 existed with `resolves: []`,
    # so the minimal-set solver could never select it and EU AI Act Art. 50(2)
    # marking could never be required by any verdict. This invariant is the
    # consumer that control was written for.
    condition:
      model_type: { in: ["llm", "generative-ai", "agentic"] }
      exposure: { in: ["client-facing", "market-facing"] }
      action_type: { in: ["draft", "recommend", "execute"] }
    severity: "Medium"
    required_controls: ["CTRL-SYNTHMARK-01"]
    regulatory_basis: "EU AI Act Art. 50(2) (applies from 2 August 2026)"

  - id: "INV-TRACK2-01"
    description: "AI model versions must be pinned and outputs monitored for silent substitution"
    condition:
      model_type: { in: ["ml", "deep-learning", "llm", "generative-ai", "agentic"] }
      decision_bindingness: { in: ["advisory", "material", "binding"] }
    severity: "High"
    required_controls: ["CTRL-FINGERPRINT-01", "CTRL-INDEP-VAL-01"]
    regulatory_basis: "RAF §5 — Track II baseline; zero tolerance for unmonitored vendor model change"

  - id: "INV-HALLUC-01"
    description: "Generative output informing a material decision must be grounded in retrievable source material"
    # Agentic added: an agent is generative underneath, so excluding it gave a
    # tool-using agent FEWER generative-risk controls than a plain LLM doing
    # the same work — the inverse of the intended risk ordering.
    condition:
      model_type: { in: ["llm", "generative-ai", "agentic"] }
      decision_bindingness: { in: ["material", "binding"] }
    severity: "High"
    required_controls: ["CTRL-GROUND-01"]
    regulatory_basis: "RAF §9 — grounding verification mode"

  - id: "INV-CITE-01"
    description: "Generated text presented to a human must carry resolvable citations to its sources"
    # Widened from action_type: [draft] only. A retrieval-and-summarisation
    # assistant classified as `read` is the canonical hallucination surface and
    # previously carried no citation obligation at all.
    condition:
      model_type: { in: ["llm", "generative-ai", "agentic"] }
      action_type: { in: ["read", "draft", "recommend"] }
    severity: "Medium"
    required_controls: ["CTRL-CITE-01"]
    regulatory_basis: "RAF §9 — grounding minimum requirements"

  - id: "INV-AGENT-01"
    description: "Agentic systems must log every tool call and expose an immediate stop control"
    condition:
      model_type: { in: ["agentic"] }
    severity: "High"
    required_controls: ["CTRL-LOG-01"]
    regulatory_basis: "RAF §6 — agentic / tool-use controls"

  - id: "INV-AUTONOMY-01"
    description: "A system acting independently on a material or binding decision must have a human decision gate or a bounded authority envelope"
    # Oracle round 001, the most damaging finding in the round: the ONLY control
    # resolving this was CTRL-HITL-02 ("every action reviewed and approved by a
    # human before execution"). For any autonomous design the minimal fix
    # therefore ABOLISHED the use case, and the engine still reported
    # "in appetite with controls" — claiming a mitigation where the honest
    # answer was that the design was out of appetite as specified.
    #
    # CTRL-AUTONOMY-BOUND-01 gives a real second path, and carries the lower
    # burden so the solver prefers it.
    # ACTING, not merely advising (oracle round 002). v1.1 keyed this on
    # autonomy + bindingness alone, so it caught recommend-only pipelines
    # with a human reviewing every flagged case — and then demanded either a
    # "bounded authority envelope with hard value and volume limits" or a human
    # gate the design already had. Both adjudicators flagged it: the file's most
    # severe invariant was firing on half the corpus, which dilutes what a
    # Critical binding constraint communicates.
    #
    # action_type is used rather than `hitl` deliberately. `hitl` is optional on
    # the graph, and matchesCondition() treats an ABSENT field as no-match — so
    # a condition on hitl would let a use case escape this invariant by simply
    # leaving the question blank. Fail-open on the most severe rule in the file
    # is not a trade worth making. action_type is always present.
    condition:
      autonomy_level: { gte: 2 }
      decision_bindingness: { in: ["material", "binding"] }
      action_type: { in: ["execute", "trade", "approve"] }
    severity: "Critical"
    required_controls: ["CTRL-AUTONOMY-BOUND-01", "CTRL-HITL-02"]
    regulatory_basis: "RAF §7 — autonomy ceiling"

  - id: "INV-AUTONOMY-02"
    description: "A system acting independently in front of a client must have a bounded authority envelope"
    # NEW (oracle round 001). INV-AUTONOMY-01 exempts `advisory`, so a
    # client-facing assistant at autonomy 2 with no human in the loop carried
    # no autonomy obligation at all. Advisory output delivered straight to a
    # retail client is functionally the decision.
    # Same correction as INV-AUTONOMY-01: a conversational assistant that only
    # emits text was being told to impose value and volume limits on an
    # authority envelope, which is not a coherent construct for it.
    condition:
      autonomy_level: { gte: 2 }
      exposure: { in: ["client-facing", "market-facing"] }
      action_type: { in: ["execute", "trade", "approve"] }
    severity: "High"
    required_controls: ["CTRL-AUTONOMY-BOUND-01", "CTRL-HITL-02"]
    regulatory_basis: "OSFI E-23 §4.3; FCA Consumer Duty PRIN 2A"

  - id: "INV-IRREV-01"
    description: "An irreversible action taken with limited human oversight must have a reversal window before it commits"
    # NEW (oracle round 001) — the demoted HL-005. As a hard line it rejected
    # routine retention-driven deletion outright, which storage-limitation
    # obligations require a firm to perform. As an invariant it is mitigable by
    # a quarantine or dry-run window, which is how such systems are actually run.
    condition:
      output_reversibility: { in: ["irreversible"] }
      autonomy_level: { gte: 2 }
    severity: "Critical"
    required_controls: ["CTRL-REVERSAL-01"]
    regulatory_basis: "SS1/23 §3.8; GDPR Art. 5(1)(e)"

  - id: "INV-CONDUCT-01"
    description: "Client-facing and market-facing AI must be conduct-tested before launch and periodically after"
    condition:
      exposure: { in: ["client-facing", "market-facing"] }
    severity: "High"
    required_controls: ["CTRL-CONDUCT-01"]
    regulatory_basis: "RAF §4 — conduct & fairness"

  - id: "INV-FAIRNESS-01"
    description: "AI informing a decision about a person must be tested for disparate outcomes across protected groups"
    # NEW (oracle round 001), and the finding a regulator would reach first.
    # INV-CONDUCT-01 keys on the DELIVERY CHANNEL, so a consumer credit
    # scorecard and a collections model over customers in financial difficulty
    # tripped NO fairness obligation, because their interface is internal.
    # Conduct risk follows the person the decision is about, not the screen it
    # renders on. Note kri_thresholds.conduct.bias_disparity_pct was defined
    # and no invariant ever required it to be measured.
    condition:
      decision_type: { in: ["credit-decision", "lending-decision", "hiring", "pricing", "fraud-detection"] }
    severity: "High"
    required_controls: ["CTRL-BIAS-01"]
    regulatory_basis: "EU AI Act Annex III §5(b) and §4(a); ECOA/Reg B; FCA Consumer Duty PRIN 2A"

  - id: "INV-ESCALATE-01"
    description: "Client-facing AI must offer a route to a human"
    # Model-type gate REMOVED (oracle round 002). Round 001's lesson was that
    # conduct obligations follow the affected person, not the technology — and
    # v1.1 applied it to INV-CONDUCT-01 and INV-FAIRNESS-01 while leaving the
    # sibling rules gated on model family. A client turned down by a
    # deep-learning system needs the human route exactly as much as one talking
    # to an LLM. This is RF-3 in the project's own calibration file: when a
    # defect class is fixed in one place, audit every sibling call site.
    condition:
      exposure: { in: ["client-facing"] }
    severity: "High"
    required_controls: ["CTRL-ESCALATE-01"]
    regulatory_basis: "RAF §4 — client harm / escalation"

  - id: "INV-DRIFT-01"
    description: "A model informing a material or binding decision must be monitored for performance drift"
    # Widened to every model type. Excluding LLMs meant an LLM feeding a
    # Critical-tier credit decision needed no drift monitoring while a logistic
    # regression doing less did. Model-version staleness is tracked in
    # kri_thresholds and was enforced for nobody.
    condition:
      model_type: { in: ["statistical", "traditional-ml", "ml", "deep-learning", "llm", "generative-ai", "agentic"] }
      decision_bindingness: { in: ["material", "binding"] }
    severity: "High"
    required_controls: ["CTRL-DRIFT-01", "CTRL-INDEP-VAL-01"]
    regulatory_basis: "RAF §8 — drift signals; SS1/23 §3.4"

  - id: "INV-EXPLAIN-01"
    description: "A model informing a material or binding decision must be able to explain a single outcome"
    # Widened to generative model types for the same reason as INV-DRIFT-01.
    condition:
      model_type: { in: ["ml", "deep-learning", "llm", "generative-ai", "agentic"] }
      decision_bindingness: { in: ["material", "binding"] }
    severity: "Medium"
    required_controls: ["CTRL-EXPLAIN-01", "CTRL-INDEP-VAL-01"]
    regulatory_basis: "RAF §5 — Track II transparency"

  - id: "INV-SEC-01"
    description: "A model consuming text or documents it did not author must be adversarially tested"
    # Widened to deep-learning: a KYC document pipeline ingesting
    # adversary-supplied documents is a classic evasion target and tripped no
    # security invariant, because the risk was keyed to model family rather
    # than to where the input came from.
    condition:
      model_type: { in: ["deep-learning", "llm", "generative-ai", "agentic"] }
      exposure: { in: ["internal-shared", "client-facing", "market-facing"] }
    severity: "Medium"
    required_controls: ["CTRL-REDTEAM-01"]
    regulatory_basis: "RAF §9 — adversarial verification mode"

  - id: "INV-VENDOR-01"
    description: "A third-party component outside the firm's registry must have a third-party risk assessment"
    # NEW (oracle round 001). An unlisted vendor previously had NO consequence
    # in the rulebook at all — it merely lost inheritance it never had, landing
    # at the same posture as a vetted internal deployment.
    #
    # MAINTENANCE COUPLING: this `not_in` list must name every id in the
    # `vendors:` registry below, plus the reserved `internal` sentinel. Adding
    # a vendor to the registry without adding it here leaves this invariant
    # firing on a cleared vendor. scripts/spec-parity-check.py R8 enforces it.
    condition:
      vendor: { not_in: ["internal", "VENDOR-APPROVED-LLM"] }
    severity: "High"
    required_controls: ["CTRL-TPRM-01"]
    regulatory_basis: "DORA Art. 28-30; OSFI B-10"

  - id: "INV-SAMPLE-01"
    description: "Recommendations issued at scale must be sampled and reviewed against outcomes"
    condition:
      action_type: { in: ["recommend"] }
      scale: { in: ["at_scale"] }
    severity: "Medium"
    required_controls: ["CTRL-SAMPLE-01"]
    regulatory_basis: "RAF §9 — behavioural verification mode"

# ------------------------------------------------------------------------------
# CONTROL LIBRARY
# ------------------------------------------------------------------------------
# `burden` drives two things: which control the minimal-set solver picks when
# several resolve the same invariant, and — as of oracle round 001 — which
# tripped invariant is reported as BINDING when several share the top severity.
# Before that change the engine tie-broke alphabetically, which is why it
# named INV-DATA-01 on a case both independent adjudicators read as
# INV-HALLUC-01.
#
# Proof-carrying controls (V1.3): a control with no verification_evidence
# block renders as UNVERIFIED on the verdict. Statuses are hand-attested in
# this file in V1; machine-checked evidence binding arrives in V1.5. That the
# starter file leaves most controls UNVERIFIED is deliberate — the firm has
# attested nothing yet, and the UI must not imply otherwise (NF-2).
#
# NOTE FOR AUTHORS — THREE BANNED WORDS, INCLUDING IN COMMENTS.
# The Appetite framework view renders this entire file, and three words are
# asserted with single-match queries in the UI tests: the two verdict statuses
# (approv-ed / reject-ed) and the past tense of "to fire", which is a
# per-verdict concept and never a static pack state. Write "in appetite",
# "out of appetite", and "matches" / "catches" instead.
# This note originally contained the banned words themselves and broke the very
# test it documents (oracle round 002) — hence the hyphens above. The verdict screen is asserted with a single-match
# query over those two words and policy text reaches that screen.
# ─────────────────────────────────────────────────────────────────────────────
# DOWNSTREAM REVIEWS (CS-3)
#
# Processes this firm requires ALONGSIDE the AI risk pre-check, triggered by a
# use case's characteristics. They are not part of the pre-check and do not
# change the verdict — the pre-check is complete, and these are additional
# obligations the submitter must still discharge.
#
# ⚠ DRAFT — NOT YET ADOPTED. These three rules are a starting point written to
# make the mechanism usable, not a statement of this firm's processes. Every
# one of them names a team or process that your firm may not have, may call
# something else, or may trigger on different criteria. Review each against
# how your organisation actually works before relying on it, exactly as you
# would a jurisdiction pack rule (grounding/PACK-AUTHORING.md: rule authoring
# is human-led).
#
# No `regulatory_basis` is set on these. They are bank-configured processes,
# not regulatory determinations, and inventing a citation for an internal
# process would be exactly the fabrication this product refuses elsewhere.
# Add one only where a regulator genuinely mandates the process.
#
# The condition vocabulary is the same one the invariants above use.
# ─────────────────────────────────────────────────────────────────────────────
downstream_reviews:
  - id: "DR-INFOSEC-01"
    review: "Information security review"
    # CS-3 names this case explicitly. Price-sensitive information handled by
    # an AI system is the scenario most firms already route to InfoSec.
    # `data_class` exists only on input nodes, so this cannot misfire on a
    # different part of the graph.
    condition:
      data_class: { in: ["MNPI"] }

  - id: "DR-INFOSEC-02"
    review: "Information security review"
    # Client personal data. Same field, same guarantee.
    condition:
      data_class: { in: ["Client PII"] }

  - id: "DR-VENDOR-01"
    review: "Vendor risk assessment"
    # Any third-party model or service. `vendor` exists only on processing
    # nodes, so this asks about the system rather than about its inputs. The
    # unregistered-component path already catches vendors absent from the
    # approved registry; this catches the declared-but-external case, which is
    # a different question and a different team.
    condition:
      vendor: { not_in: ["internal"] }

  # ⚠ NOT WRITTEN — "Cloud security approval", triggered by processing outside
  # the firm's estate, is the obvious fourth rule and CS-3 names it. It cannot
  # be expressed correctly today: `data_zone` exists on BOTH input and
  # processing nodes, and a condition matches if ANY node satisfies it
  # (src/engine/condition.ts:6-19). A rule reading
  # `data_zone: { in: ["Zone B"] }` would fire on a use case whose DATA sits in
  # Zone B while the model runs safely in Zone C — the wrong question, silently
  # answered.
  #
  # Writing it anyway would put a required review in front of people for a
  # reason that is not true. The gap is in the condition language, not in the
  # policy: it needs a way to scope a condition to a node type. Recorded as
  # FN-005 rather than papered over.

controls:
  - id: "CTRL-ENC-01"
    name: "Encryption in transit (TLS 1.3+)"
    description: "All data in transit to external endpoints must use TLS 1.3 or higher"
    resolves: ["INV-DATA-01"]
    burden: 2
    verification: "Deployment manifest shows TLS 1.3 endpoint; no HTTP fallback"
    verification_evidence:
      status: "verified"
      detail: "Platform allow-list pins TLS 1.3; platform attestation on file"
      attested_by: "[FIRM] — Platform Engineering"
      attested_at: "[DATE]"
      # R10-CE: optional design/operating effectiveness axes (COSO wording).
      # Legacy evidence without these axes remains valid and renders as before.
      design:
        status: "effective"
        detail: "Control design covers the allow-list and the pinning check"
      operating:
        status: "not_assessed"
        detail: "No operating-effectiveness test performed yet in this starter file"

  - id: "CTRL-DISCLOSE-01"
    name: "AI interaction disclosure"
    description: "The interface states plainly that the person is interacting with an AI system, before the interaction begins"
    resolves: ["INV-DISCLOSE-01"]
    burden: 1
    verification: "Screenshot or interface copy showing the disclosure at first contact"

  - id: "CTRL-SYNTHMARK-01"
    name: "Synthetic content marking"
    description: "AI-generated content leaving the firm is marked in a machine-readable format as artificially generated"
    resolves: ["INV-SYNTHMARK-01"]
    burden: 3
    verification: "Output carries provenance metadata (e.g. C2PA) detectable by a third party"

  - id: "CTRL-FINGERPRINT-01"
    name: "Output fingerprinting + version pinning"
    description: "Model version pinned; outputs fingerprinted against a fixed probe set to detect silent substitution"
    resolves: ["INV-TRACK2-01"]
    burden: 2
    verification: "Probe set and baseline fingerprints on file; alert on step-change in aggregate grounding confidence"

  - id: "CTRL-INDEP-VAL-01"
    name: "Independent validation (2LoD)"
    description: "A validation team independent of the builders reviews the model, its limitations and its monitoring plan before use"
    # Resolves three invariants, so it gives coverage DEPTH on each — the
    # mechanism CS-1's safety margin needs and the prior library could not
    # provide with one control per invariant.
    resolves: ["INV-TRACK2-01", "INV-DRIFT-01", "INV-EXPLAIN-01"]
    burden: 5
    verification: "Signed independent validation report naming the validator and the date"

  - id: "CTRL-CITE-01"
    name: "Resolvable citations"
    description: "Every generated statement carries a citation a reader can open and check against the source"
    resolves: ["INV-CITE-01"]
    burden: 2
    verification: "Sampled outputs show citations that resolve to the cited passage"

  - id: "CTRL-ESCALATE-01"
    name: "Human escalation route"
    description: "The client can reach a human at any point, and the route is visible without asking for it"
    resolves: ["INV-ESCALATE-01"]
    burden: 2
    verification: "Escalation path documented and exercised in test"

  - id: "CTRL-LOG-01"
    name: "Tool-call logging + stop control"
    description: "Every tool call is logged with its arguments; an immediate stop control exists and permissions are least-privilege"
    resolves: ["INV-AGENT-01"]
    burden: 3
    verification: "Log sample showing tool calls and arguments; stop control exercised in test"

  - id: "CTRL-AUTONOMY-BOUND-01"
    name: "Bounded authority envelope + sampled post-hoc review"
    description: "The system acts only inside a written authority envelope with hard value and volume limits, anything outside it stops for a human, an immediate stop control exists, and a defined sample of actions is reviewed after the fact against outcomes"
    # The control the library was missing. Without it the only way to satisfy
    # INV-AUTONOMY-01 was to remove the autonomy, so the framework could not
    # express "acts independently inside a defined scope" at all — a design
    # pattern that is standard in payments repair and alert triage.
    resolves: ["INV-AUTONOMY-01", "INV-AUTONOMY-02"]
    burden: 4
    verification: "Authority envelope document with limits; stop control exercised in test; post-hoc review sampling rate and results on file"

  - id: "CTRL-HITL-02"
    name: "Human decision gate on every action"
    description: "Every action proposed by the AI is reviewed and signed off by a human before it takes effect"
    resolves: ["INV-AUTONOMY-01", "INV-AUTONOMY-02"]
    burden: 5
    verification: "Workflow evidence showing no action executes without a recorded human decision"

  - id: "CTRL-REVERSAL-01"
    name: "Reversal window before irreversible commit"
    description: "The action is staged in a recoverable state for a defined window, reconciled, and only then committed; a dry-run mode exists"
    resolves: ["INV-IRREV-01"]
    burden: 3
    verification: "Window length documented; a reversal exercised end-to-end in test; reconciliation report on file"

  - id: "CTRL-DRIFT-01"
    name: "Drift monitoring"
    description: "Model performance is monitored against the KRI thresholds in this file, with a named owner for breaches"
    resolves: ["INV-DRIFT-01"]
    burden: 3
    verification: "Monitoring dashboard and breach escalation history"

  - id: "CTRL-EXPLAIN-01"
    name: "Single-outcome explanation"
    description: "For any individual output the system can produce the factors that drove it, in language the affected person could follow"
    resolves: ["INV-EXPLAIN-01"]
    burden: 3
    verification: "Worked explanation for a sampled individual outcome"

  - id: "CTRL-REDTEAM-01"
    name: "Adversarial testing"
    description: "The system is tested against hostile input — injection, evasion and forged documents — before launch and after material change"
    resolves: ["INV-SEC-01"]
    burden: 3
    verification: "Red-team report with findings and their remediation"

  - id: "CTRL-TPRM-01"
    name: "Third-party risk assessment"
    description: "The supplier is assessed for security, resilience, data handling, concentration and exit before use, and reassessed periodically"
    resolves: ["INV-VENDOR-01"]
    burden: 4
    verification: "Completed third-party assessment and a signed exit plan on file"

  - id: "CTRL-BIAS-01"
    name: "Disparate outcome testing"
    description: "Outcomes are tested for disparity across protected groups against the bias thresholds in this file, before launch and periodically after"
    resolves: ["INV-FAIRNESS-01"]
    burden: 4
    verification: "Disparity test results against kri_thresholds.conduct.bias_disparity_pct, with the population and method stated"

  - id: "CTRL-SAMPLE-01"
    name: "Outcome sampling"
    description: "A defined sample of recommendations is reviewed against what actually happened, with the rate stated"
    resolves: ["INV-SAMPLE-01"]
    burden: 2
    verification: "Sampling rate documented and review results on file"

  - id: "CTRL-GROUND-01"
    name: "Retrieval grounding + confidence reporting"
    description: "Output is generated only from retrieved source material, and low-confidence answers say so rather than guessing"
    resolves: ["INV-HALLUC-01"]
    burden: 4
    verification: "Retrieval logs showing sources per output; abstention behaviour exercised in test"

  - id: "CTRL-CONDUCT-01"
    name: "Conduct testing + transcript audit"
    description: "Pre-launch and periodic conduct testing, with sampled transcript audit for client harm and fairness"
    resolves: ["INV-CONDUCT-01"]
    burden: 4
    verification: "Conduct test results and transcript audit sampling on file"


kri_thresholds:
  performance:
    drift_pct: { green: { lte: 3.0 }, amber: { lte: 7.0 }, red: { gt: 7.0 } }
    override_rate_pct:
      low_risk: { green: { gte: 5.0, lte: 40.0 }, amber: { lte: 80.0 }, red: { gt: 80.0 } }
      high_risk: { green: { gte: 5.0, lte: 20.0 }, amber: { lte: 50.0 }, red: { gt: 50.0 } }
  data_privacy:
    pii_incident_count: { green: 0, amber: { lte: 2 }, red: { gt: 2 } }
  technology:
    model_version_staleness_days: { green: { lte: 60 }, amber: { lte: 120 }, red: { gt: 120 } }
  conduct:
    bias_disparity_pct: { green: { lte: 1.5 }, amber: { lte: 3.0 }, red: { gt: 3.0 } }
  third_party_concentration:
    single_vendor_share_pct: { green: { lte: 40.0 }, amber: { lte: 60.0 }, red: { gt: 60.0 } }
  autonomy:
    level_4_approval_required: true

jurisdictions:
  - code: "UK"
    name: "United Kingdom"
    pack_files: ["policy/packs/ss1-23.yaml"]
  - code: "US"
    name: "United States"
    pack_files: ["policy/packs/sr-26-2.yaml"]
  - code: "EU"
    name: "European Union"
    pack_files: ["policy/packs/eu-ai-act.yaml", "policy/packs/dora.yaml"]
  # CA, SG and JP are DECLARED but have NO PACK — deliberately, as of v1.3.
  #
  # Their packs (OSFI E-23, MAS FEAT, FSA Japan) were written with
  # "[ILLUSTRATIVE — NOT VERBATIM]" rule text and "[NOT RETRIEVED]" source
  # dates, and they still added required controls and reviews to verdicts.
  # Oracle round 002 called those verdicts known-fictional rather than merely
  # provisional: a user could run a Canadian case and act on a control list
  # derived from text nobody had ever read. Deleted rather than kept, because a
  # rule citing a source that was never retrieved is worse than no rule — it
  # looks like coverage.
  #
  # A declared jurisdiction with an empty pack list is the honest state: the
  # firm operates here, and this jurisdiction has not been assessed. Verdicts
  # for these jurisdictions apply the firm's own appetite only.
  #
  # TO AUTHOR THEM PROPERLY, see grounding/PACK-AUTHORING.md. Each rule needs
  # the retrieved primary text verbatim, the retrieval date, the provision
  # reference, and a named human sign-off. The regulators and the specific
  # instruments are:
  #   CA  — OSFI Guideline E-23 (Model Risk Management), final 2025-09-11,
  #         in force 2027-05-01. Was: tier floor + action logging at autonomy>=2.
  #   SG  — MAS FEAT principles (non-binding) plus the AI Risk Management
  #         Guidelines consulted on to 2026-01-31, 12-month transition. Not yet
  #         a stable rule source, which is part of why this pack was invented.
  #   JP  — FSA Japan AI discussion papers. No binding instrument identified.
  - code: "CA"
    name: "Canada"
    pack_files: []
  - code: "SG"
    name: "Singapore"
    pack_files: []
  - code: "JP"
    name: "Japan"
    pack_files: []

roles:
  "1LoD": { access: "own" }
  "2LoD": { access: "all" }

tier_workflow:
  Critical: "2LoD-approve"
  High: "2LoD-approve"
  Medium: "2LoD-notify"
  Low: "self-service"

# Which tripped invariant a verdict reports as BINDING when several fire.
# Comparators are applied in this order until one separates the candidates.
#
# This lived only in engine code until oracle round 002. An adjudicator put it
# plainly: a comment about code is not a policy rule, and a determinism and
# auditability claim cannot rest on one. Two conforming implementations could
# disagree about the headline of a verdict. It is a rule of the appetite, so it
# belongs in the appetite.
#
#   severity        — Critical > High > Medium > Low
#   control_burden  — the CHEAPEST control that would satisfy the invariant,
#                     i.e. its unavoidable cost. Highest wins.
#   id              — last resort, alphabetical, so the result is total and
#                     deterministic (NF-1). Ties still reaching this step mean
#                     the two invariants are genuinely equal under the declared
#                     criteria; if that is unacceptable for a given pair, the
#                     fix is to price their controls differently, not to add a
#                     hidden rule here.
binding_constraint_order: ["severity", "control_burden", "id"]

safety_margin: 0.10

# ==============================================================================
# APPROVED PLATFORM REGISTRY (PV-1) — [FIRM] MUST REPLACE
# ==============================================================================
# Illustrative entries so the inheritance mechanics are visible before a firm
# builds its own registry (PV-8). These are NOT your firm's approvals.
#
# How it works: a use case declaring one of these platforms inherits the
# controls its approval already satisfies — but ONLY where the use case sits
# inside the approved envelope. Exceed any dimension and the inheritance is
# withdrawn (PV-3), because a platform approval is granted as a package and
# partially exceeding its basis does not leave the remainder justified.
#
# Every inheritance is shown on the verdict with the envelope that justified
# it, so "was residency assessed?" has an answer (PV-6).
platforms:
  - id: "PLAT-INTERNAL-ML"
    name: "[FIRM] internal ML platform"
    approved_envelope:
      max_data_class: "Confidential"
      max_exposure: "internal-shared"
      max_autonomy_level: 2
      data_zones: ["Zone B", "Zone C"]
      jurisdictions: ["UK", "EU"]
    satisfies_controls:
      - "CTRL-ENC-01"
      - "CTRL-FINGERPRINT-01"
      - "CTRL-DRIFT-01"

  - id: "PLAT-CLOUD-LLM"
    name: "[FIRM] approved cloud LLM service"
    # Deliberately narrower: cleared for drafting work, not for client-facing
    # output or personal data. A client-facing chatbot on this platform
    # exceeds it and inherits nothing — the visible over-envelope case PV-8
    # asks for.
    approved_envelope:
      max_data_class: "Internal"
      max_exposure: "internal-shared"
      max_autonomy_level: 1
      data_zones: ["Zone B"]
      jurisdictions: ["UK", "EU"]
    satisfies_controls:
      - "CTRL-ENC-01"
      - "CTRL-FINGERPRINT-01"

# APPROVED VENDOR / MODEL REGISTRY (PV-2) — [FIRM] MUST REPLACE
# A model not on this registry is treated as a new vendor and inherits
# nothing (PV-5). Ids must match the `vendor` recorded on the use case.
vendors:
  - id: "VENDOR-APPROVED-LLM"
    name: "[FIRM]-approved third-party LLM"
    approved_envelope:
      max_data_class: "Internal"
      max_exposure: "internal-shared"
      data_zones: ["Zone B"]
    satisfies_controls:
      - "CTRL-ENC-01"

# APPROVED-MODEL REGISTRY (R11-MG-1) — [FIRM] MUST REPLACE
# A model absent from this registry, or present with is_approved: false,
# trips the model-governance review at evaluation (evaluate.ts). Provenance
# class is an attribute the firm's rules judge, never a hardcoded penalty —
# open-weights self-hosted with strong finance-domain benchmark evidence may
# sit inside appetite where a vendor-hosted model without evidence does not.
approved_models:
  # AIGate's own local runtime model (src/llm/local-provider.ts
  # DEFAULT_LOCAL_LLM_MODEL) — declared honestly as unadopted-policy
  # provisional, not benchmarked: is_approved: false is the truthful demo
  # posture, not a placeholder to fix later (NF-7).
  - model_id: "qwen3:4b"
    vendor: "local (Ollama)"
    provenance_class: "open_weights_self_hosted"
    is_approved: false
    license_note: "Apache 2.0 (Qwen3 weights) — no firm benchmark evidence on file yet"

  - model_id: "VENDOR-LLM-v1"
    vendor: "[FIRM]-approved third-party LLM"
    provenance_class: "vendor_hosted"
    is_approved: true
    license_note: "Commercial API license, standard terms"
    benchmark_evidence:
      suite: "[FIRM] Model Risk finance-domain eval suite"
      date: "2026-06-01"
      finance_domain: true
      detail: "Re-run within the last 12 months per Model Risk cadence"

  # R11-MG-1a illustrative FAMILY entry (ADR-PS-R11-1a) — exact-id-first,
  # family-fallback. This is a demo of the mechanism, not a real firm
  # decision: a declared_model_id like "gpt-4o-2026-08-01" that has no
  # exact entry above resolves against this family instead of reading as
  # unlisted the moment the vendor ships a new point release. An exact
  # entry for a specific gpt-4o build would still win over this one.
  - model_id: "gpt-4o-family"
    vendor: "OpenAI (illustrative)"
    provenance_class: "vendor_hosted"
    is_approved: true
    is_family: true
    version_pattern: "gpt-4o-"
    license_note: "Illustrative only — no firm has actually approved this family"
